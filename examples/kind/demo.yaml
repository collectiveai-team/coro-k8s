# What the demo batch talks to besides coro: a web server holding the audio, and
# a callback receiver that logs every request it gets.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio
  namespace: demo
spec:
  selector:
    matchLabels: {app: audio}
  template:
    metadata:
      labels: {app: audio}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - name: audio
              mountPath: /usr/share/nginx/html
      volumes:
        - name: audio
          configMap:
            name: demo-audio
---
apiVersion: v1
kind: Service
metadata:
  name: audio
  namespace: demo
spec:
  selector: {app: audio}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: callback-receiver
  namespace: demo
spec:
  selector:
    matchLabels: {app: callback-receiver}
  template:
    metadata:
      labels: {app: callback-receiver}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:39
          env:
            - name: HTTP_PORT
              value: "8080"
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: callback-receiver
  namespace: demo
spec:
  selector: {app: callback-receiver}
  ports: [{port: 80, targetPort: 8080}]
